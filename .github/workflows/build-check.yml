name: Build check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            mpich \
            libnetcdf-dev \
            libnetcdff-dev \
            libpnetcdf-dev

      - name: Show compiler environment
        run: |
          gcc --version
          gfortran --version
          mpicc --version || true
          which mpif90 || true

      - name: Build MPAS
        run: |
          make clean || true
          make gfortran CORE=atmosphere -j 2
