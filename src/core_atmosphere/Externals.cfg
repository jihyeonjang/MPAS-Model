# CCPP physics, used here for the NRL/CHEM2D ozone photochemistry
# parameterization (physics/photochem/module_ozphys.F90).
#
# The hash below is the ccpp-physics submodule commit referenced by
# ufs-community/ufs-weather-model, branch production/GFS.v17
# (via NOAA-EMC/ufsatm -> ccpp/physics).
#
# Nothing in this checkout is modified by MPAS.  The subset of files that is
# compiled is listed in src/core_atmosphere/chemistry/ccpp_ozone/Makefile.
#
# NOTE: checkout_externals is run from src/core_atmosphere/physics, so local_path is relative to that
# directory.  The path below places the checkout under chemistry/, next to the code that uses it.
[CCPP-physics]
local_path = ./../chemistry/physics_ccpp
protocol = git
repo_url = https://github.com/ufs-community/ccpp-physics.git
hash = 8007f2c3e32e20a4aea56576ccf50aaca7d18f44
required = True

[externals_description]
schema_version = 1.0.0
